<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <title>Gymaholic | Gym Apparel, Lifting Gear & Fuel Log</title>
    <meta
      name="description"
      content="Heavyweight gym apparel, lifting straps, belts and shakers, plus a free meal and protein tracker. Built for people who plan their week around leg day."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gymaholic" />
    <meta property="og:url" content="https://gymaholictracker.com/" />
    <meta property="og:title" content="Gymaholic | Gym Apparel, Lifting Gear & Fuel Log" />
    <meta
      property="og:description"
      content="Heavyweight apparel and no-nonsense lifting gear, plus a free meal and protein tracker."
    />
    <meta property="og:image" content="https://gymaholictracker.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://gymaholictracker.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Gymaholic needs JavaScript to run the shop and Fuel Log.</noscript>

    <!-- Static form definitions so Netlify Forms can detect them at deploy time. -->
    <form name="newsletter" data-netlify="true" hidden>
      <input type="email" name="email" />
    </form>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input type="email" name="email" />
      <select name="topic"><option>Order question</option></select>
      <input name="order" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
